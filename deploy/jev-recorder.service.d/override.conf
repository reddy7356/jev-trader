# Keep the recordings off the small root volume: /data is the data disk in /etc/fstab.
# `data/rec` in the repo is a symlink to this directory (see docs/runbook.md).
# Install:
#   sudo mkdir -p /etc/systemd/system/jev-recorder.service.d
#   sudo cp deploy/jev-recorder.service.d/override.conf /etc/systemd/system/jev-recorder.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart jev-recorder
[Service]
Environment=REC_DIR=/data/jev-rec/rec
