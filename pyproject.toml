[project]
name = "jev-trader"
version = "0.1.0"
description = "24/7 market-making trading system around Jev (TypeSafe System One) decisions: deterministic state, calibrated judgments, hard risk vetoes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "buberlo" }]
keywords = ["trading", "market-making", "typesafe", "jev", "system-one", "hft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "numpy>=1.26",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "websockets>=16.1.1",
]

[project.scripts]
jev-trader = "jev_trader.cli:main"

[project.urls]
Repository = "https://github.com/buberlo/jev-trader"

[project.optional-dependencies]
live = [
    "hyperliquid-python-sdk>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_trader"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
